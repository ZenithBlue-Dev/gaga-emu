name: GagaEmu
# The core frameworks and GAGA_HAS_<ID> defines. Run scripts/generate-project.sh, not xcodegen directly.
include:
  - path: build/core-set.yml
    relativePaths: false
options:
  bundleIdPrefix: com.zenithblue
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top

configs:
  Debug: debug
  DevJIT: debug
  Release: release

settings:
  # GagaEmu Pro is sold in every App Store build (docs/06 section 4.5); PAYWALL_ENABLED is retired.
  SWIFT_VERSION: "5.9"
  ENABLE_BITCODE: NO
  CLANG_ENABLE_MODULES: YES
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TARGETED_DEVICE_FAMILY: "1,2"
  DEVELOPMENT_TEAM: "9227VF8RW4"
  CODE_SIGN_STYLE: Automatic
  CODE_SIGN_IDENTITY: "Apple Development"
  # Cores are built for arm64 only (scripts/build-core.sh).
  "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  GagaEmu:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/Localizable.xcstrings
      # Bundled cheats (scripts/build-cheat-pack.py).
      - path: Resources/cheats.pack
        buildPhase: resources
      # Device skins (docs/06 section 3.8): a folder reference, so the app keeps Device/<platform>/ and reads the PDFs
      # with CGPDFDocument at runtime.
      - path: Resources/Skins/Device
        type: folder
        buildPhase: resources
    dependencies:
      - target: GagaSlang
      - target: GagaCheevos
    # Only the DevJIT configuration gets the development JIT option. scripts/nojit-gate.sh refuses it in any other.
    configFiles:
      DevJIT: DevJIT.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zenithblue.gagaemu
      # GagaSlang is C++.
      OTHER_LDFLAGS: $(inherited) -lc++
      # rc_client.h declares identify-and-load only with this, and GagaCheevos builds with it.
      OTHER_SWIFT_FLAGS: $(inherited) -Xcc -DRC_CLIENT_SUPPORTS_HASH
      INFOPLIST_FILE: Sources/App/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconTwoBeats AppIconFolio AppIconShelf AppIconWell AppIconPhosphor
      CODE_SIGN_ENTITLEMENTS: Sources/App/GagaEmu.entitlements
      SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/GagaBridge-Bridging-Header.h
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Sources/Bridge
        - $(SRCROOT)/Vendor/rcheevos/include
        - $(SRCROOT)/Vendor/rcheevos/src
        - $(SRCROOT)/Cores/melonds_ds/deps/libretro-common/include
      # Not OTHER_CFLAGS: C++ inherits those, and -std=c99 is an error in a C++ compile.
      GCC_C_LANGUAGE_STANDARD: c99
      # The no-JIT gate reads the built app, outside what a sandboxed script may read.
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    frameworks:
      - Metal
      - MetalKit
      - GameController
      - CoreHaptics
      - AVFoundation
      - StoreKit
      - AudioToolbox
      - GameKit
    postBuildScripts:
      - name: No-JIT gate
        script: '"$SRCROOT/scripts/nojit-gate.sh" --app "$TARGET_BUILD_DIR/$WRAPPER_NAME" "$SRCROOT/$CODE_SIGN_ENTITLEMENTS"'
        basedOnDependencyAnalysis: false
      # The declared output makes CodeSign wait for this file and sign it again when it changes, so a build
      # where only the commit moved still has a valid signature. Rewritten only when the commit differs.
      # It lands inside the app, <derived data>/Build/Products/<configuration>-iphoneos/GagaEmu.app/build-commit.txt,
      # not at the derived data root, and benchmark records carry it as buildCommit.
      - name: Record build commit
        script: |
          commit=$(git -C "$SRCROOT" describe --always --dirty --exclude "*")
          [ "$(cat "$SCRIPT_OUTPUT_FILE_0" 2>/dev/null)" = "$commit" ] || echo "$commit" > "$SCRIPT_OUTPUT_FILE_0"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/build-commit.txt
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - GagaEmuTests
        - GagaEmuUITests
      # Local StoreKit testing for runs from Xcode: GagaEmu Pro prices without App Store approval. Only the
      # scheme's Run action reads it, never an archive, and the file is not in the app bundle.
      storeKitConfiguration: Resources/GagaEmuPro.storekit

  # .slangp import (docs/05 section 4.2): glslang compiles a pass to SPIR-V and SPIRV-Cross writes MSL,
  # once, at import. No CPU code is generated. The sources are the pinned submodules the cores already use:
  # glslang 15.3.0 from Cores/flycast/deps/glslang (BSD-3-Clause, BSD-2-Clause, MIT, Apache-2.0) and
  # SPIRV-Cross sdk-1.3.239.0 from Cores/ppsspp/upstream/ext/SPIRV-Cross (Apache-2.0).
  # scripts/generate-project.sh checks they are checked out.
  GagaSlang:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Slang
      - path: Cores/flycast/deps/glslang
        group: GagaSlang/glslang
        includes:
          - "glslang/MachineIndependent/*.cpp"
          - "glslang/MachineIndependent/preprocessor/*.cpp"
          - "glslang/GenericCodeGen/*.cpp"
          - "glslang/OSDependent/Unix/ossource.cpp"
          - "glslang/ResourceLimits/ResourceLimits.cpp"
          - "SPIRV/GlslangToSpv.cpp"
          - "SPIRV/InReadableOrder.cpp"
          - "SPIRV/Logger.cpp"
          - "SPIRV/SpvBuilder.cpp"
          - "SPIRV/SpvPostProcess.cpp"
          - "SPIRV/SpvTools.cpp"
          - "SPIRV/doc.cpp"
          - "SPIRV/disassemble.cpp"
      - path: Cores/ppsspp/upstream/ext/SPIRV-Cross
        group: GagaSlang/SPIRV-Cross
        includes:
          - "spirv_cfg.cpp"
          - "spirv_cross.cpp"
          - "spirv_cross_parsed_ir.cpp"
          - "spirv_parser.cpp"
          - "spirv_glsl.cpp"
          - "spirv_msl.cpp"
    settings:
      PRODUCT_NAME: GagaSlang
      CLANG_CXX_LANGUAGE_STANDARD: gnu++17
      GCC_WARN_INHIBIT_ALL_WARNINGS: YES
      # Cores/flycast/include holds the build_info.h glslang's CMake would write.
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Cores/flycast/deps/glslang
        - $(SRCROOT)/Cores/flycast/include
        - $(SRCROOT)/Cores/ppsspp/upstream/ext/SPIRV-Cross
        - $(SRCROOT)/Sources/Bridge
      GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - ENABLE_OPT=0
        - GLSLANG_OSINCLUDE_UNIX

  # RetroAchievements (rcheevos, MIT, submodule Vendor/rcheevos at tag v12.5.0). An interpreter of achievement logic only:
  # this version has no Lua and generates no code.
  GagaCheevos:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Vendor/rcheevos/src
        group: GagaCheevos/rcheevos
        includes:
          - "*.c"
          - "rapi/*.c"
          - "rcheevos/*.c"
          - "rhash/*.c"
    settings:
      PRODUCT_NAME: GagaCheevos
      # The include folder ships a module map whose umbrella pulls headers rc_internal.h expects in plain include order.
      CLANG_ENABLE_MODULES: NO
      GCC_C_LANGUAGE_STANDARD: gnu11
      GCC_WARN_INHIBIT_ALL_WARNINGS: YES
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Vendor/rcheevos/include
        - $(SRCROOT)/Vendor/rcheevos/src
        - $(SRCROOT)/Cores/melonds_ds/deps/libretro-common/include
      GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - RC_CLIENT_SUPPORTS_HASH

  GagaEmuTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      # Read by testProductIDsMatchStoreKitConfiguration.
      - path: Resources/GagaEmuPro.storekit
        buildPhase: resources
    dependencies:
      - target: GagaEmu
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zenithblue.GagaEmuTests
      GENERATE_INFOPLIST_FILE: YES
      OTHER_SWIFT_FLAGS: $(inherited) -Xcc -DRC_CLIENT_SUPPORTS_HASH
      SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/GagaBridge-Bridging-Header.h
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/Sources/Bridge
        - $(SRCROOT)/Vendor/rcheevos/include
        - $(SRCROOT)/Vendor/rcheevos/src

  # Device walks (UITests/GagaEmuWalkTests.swift). A separate bundle, never inside the app, and it needs a
  # Debug app for -GagaImportTestROM.
  GagaEmuUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
      # testProPaywallShot's SKTestSession.
      - path: Resources/GagaEmuPro.storekit
        buildPhase: resources
    dependencies:
      - target: GagaEmu
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zenithblue.GagaEmuUITests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: GagaEmu
